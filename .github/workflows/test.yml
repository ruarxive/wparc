name: Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    name: pytest (${{ matrix.os }}, py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']
        exclude:
          # Exclude some combinations to speed up CI
          - os: windows-latest
            python-version: '3.8'
          - os: macos-latest
            python-version: '3.8'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Install package
      run: |
        pip install -e .

    - name: Run tests with pytest
      run: |
        pytest tests/ -v --cov=wparc --cov-report=xml --cov-report=term

    - name: Check coverage threshold (>= 75 %)
      run: |
        coverage report --fail-under=75

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  lint:
    name: flake8 + black
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Run flake8 (critical)
      run: |
        flake8 wparc/ tests/ scripts/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 wparc/ tests/ scripts/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run flake8 (project style — line-length 100)
      run: |
        flake8 wparc/ tests/ scripts/ --max-line-length=100

    - name: Check formatting with black
      run: |
        black --check wparc/ tests/ scripts/

  type-check:
    name: mypy
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Run mypy
      run: |
        mypy wparc/ --ignore-missing-imports

  docs:
    name: MkDocs build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[docs]"

    - name: Build API docs (smoke test)
      run: |
        python scripts/build_api_doc.py > /tmp/api_doc.md
        test -s /tmp/api_doc.md

    - name: Build MkDocs site
      run: |
        mkdocs build --strict --site-dir /tmp/wparc-docs

  cli-smoke:
    name: CLI smoke test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install package
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Verify CLI is callable
      run: |
        python -m wparc --help
        python -m wparc ping --help
        python -m wparc dump --help
        python -m wparc getfiles --help
        python -m wparc analyze --help
        python -m wparc index --help
        python -m wparc warc --help